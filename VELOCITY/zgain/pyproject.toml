[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "z-gain"
version = "0.1.0"
description = "Compute z-gains from normative-model z-scores for any longitudinal dataset."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
]

[project.scripts]
z-gain = "z_gain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
